name: Deploy app to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test.mjs
      - name: Stamp version (shown in Settings; also busts the offline cache)
        run: |
          v=$(git rev-parse --short HEAD)
          sed -i "s/name=\"app-version\" content=\"dev\"/name=\"app-version\" content=\"$v\"/" web/index.html
          sed -i "s/const VERSION = \"dev\"/const VERSION = \"$v\"/" web/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
